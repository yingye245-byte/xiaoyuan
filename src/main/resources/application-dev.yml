# 开发环境：本地 MySQL / Redis / RabbitMQ
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_secondhand?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
  mail:
    host: smtp.qq.com
    port: 465
    username: demo@qq.com
    password: demo-auth-code
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    # 注意：不要用 StdOutImpl。它会绕过日志框架直接 println 到标准输出，
    # 且每查询一次就逐行打印结果集，在文件重定向场景下会把请求线程拖慢到秒级。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  mail:
    mock: true

# 开发环境默认不开启 SQL 打印；需要看 SQL 时把 mapper 包级别临时调成 debug
# （日志走 logback，可被 logback-spring.xml 的滚动策略管理）。
logging:
  level:
    root: info
    com.campus.secondhand: info
    com.campus.secondhand.mapper: info
    org.springframework.security: warn