<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <h1>创建账号</h1>
        <p class="sub">注册后即可发布闲置、购买二手物品（发布首件物品后自动获得卖家权限）</p>

        <div class="flash flash-error" th:if="${error != null}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" th:object="${registerDTO}">
            <div class="form-item">
                <label class="form-label" for="username">用户名<span class="required">*</span></label>
                <input class="input" type="text" id="username" th:field="*{username}"
                       placeholder="字母开头，4-20 位字母/数字/下划线"/>
                <div class="form-error" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="form-item">
                <label class="form-label" for="nickname">昵称<span class="required">*</span></label>
                <input class="input" type="text" id="nickname" th:field="*{nickname}"
                       placeholder="同学都怎么称呼你"/>
                <div class="form-error" th:if="${#fields.hasErrors('nickname')}"
                     th:errors="*{nickname}"></div>
            </div>

            <div class="form-item">
                <label class="form-label" for="email">邮箱<span class="required">*</span></label>
                <input class="input" type="email" id="email" th:field="*{email}"
                       placeholder="用于接收交易通知邮件"/>
                <div class="form-error" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>

            <div class="grid grid-2 gap-12">
                <div class="form-item">
                    <label class="form-label" for="studentNo">学号</label>
                    <input class="input" type="text" id="studentNo" th:field="*{studentNo}"
                           placeholder="选填"/>
                    <div class="form-error" th:if="${#fields.hasErrors('studentNo')}"
                         th:errors="*{studentNo}"></div>
                </div>
                <div class="form-item">
                    <label class="form-label" for="phone">手机号</label>
                    <input class="input" type="text" id="phone" th:field="*{phone}"
                           placeholder="选填，便于面交联系"/>
                    <div class="form-error" th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-item">
                <label class="form-label" for="campus">所在校区</label>
                <input class="input" type="text" id="campus" th:field="*{campus}"
                       placeholder="如：中心校区 / 东校区"/>
                <div class="form-error" th:if="${#fields.hasErrors('campus')}"
                     th:errors="*{campus}"></div>
            </div>

            <div class="grid grid-2 gap-12">
                <div class="form-item">
                    <label class="form-label" for="password">密码<span class="required">*</span></label>
                    <input class="input" type="password" id="password" th:field="*{password}"
                           placeholder="6-20 位"/>
                    <div class="form-error" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>
                <div class="form-item">
                    <label class="form-label" for="confirmPassword">确认密码<span class="required">*</span></label>
                    <input class="input" type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="再输入一次"/>
                    <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <button class="btn btn-primary btn-block btn-lg" type="submit">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a th:href="@{/login}">直接登录</a>
            &nbsp;·&nbsp;
            <a th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>

</body>
</html>
