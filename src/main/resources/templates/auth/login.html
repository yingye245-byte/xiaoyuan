<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('登录')}"></head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <h1>欢迎回来</h1>
        <p class="sub">校内面交，安全省心 · 校园二手闲置交易平台</p>

        <div class="flash flash-error" th:if="${param.error}">
            登录失败：用户名或密码不正确，或账号已被管理员禁用
        </div>
        <div class="flash flash-success" th:if="${param.logout}">您已安全退出登录</div>
        <div class="flash flash-success" th:if="${msg != null}" th:text="${msg}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-item">
                <label class="form-label" for="username">用户名<span class="required">*</span></label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="请输入登录用户名" required autofocus/>
            </div>
            <div class="form-item">
                <label class="form-label" for="password">密码<span class="required">*</span></label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="请输入密码" required/>
            </div>
            <div class="form-item flex flex-between">
                <label class="small muted">
                    <input type="checkbox" name="remember-me"/> 7 天内免登录
                </label>
                <a class="small" th:href="@{/register}">还没有账号？去注册</a>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">登 录</button>
        </form>

        <div class="form-tip mt-16 text-center">
            演示账号：管理员 admin / admin123 &nbsp;·&nbsp; 学生 student01 / 123456
        </div>
        <div class="auth-footer">
            <a th:href="@{/}">← 返回首页逛逛</a>
        </div>
    </div>
</div>

</body>
</html>
