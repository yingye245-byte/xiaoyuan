<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>收到新的留言</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Microsoft YaHei',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(31,41,55,.06);">
                <tr>
                    <td style="background:#ff7a45;padding:20px 28px;color:#ffffff;">
                        <div style="font-size:17px;font-weight:700;">你收到一条新的留言</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#374151;font-size:14px;line-height:1.9;">
                        <p style="margin:0 0 14px;">你好，<b th:text="${nickname != null ? nickname : '同学'}">同学</b>：</p>
                        <p style="margin:0 0 14px;">
                            物品「<b th:text="${itemTitle}">物品标题</b>」下有新的留言：
                        </p>

                        <div style="background:#f7f9fc;border-radius:8px;padding:14px 16px;margin:0 0 16px;">
                            <div style="font-size:12px;color:#6b7280;margin-bottom:6px;">
                                <b th:text="${author != null ? author : '买家'}">买家</b> 说：
                            </div>
                            <div style="font-size:14px;color:#1f2937;" th:text="${content}">留言内容</div>
                        </div>

                        <p style="margin:0 0 14px;color:#6b7280;font-size:13px;">
                            建议尽快在平台上回复，方便买家确认物品成色、交付时间与地点。
                        </p>

                        <p style="margin:0;color:#6b7280;font-size:13px;">
                            登录平台 → 「物品详情页」→ 留言区，即可回复或删除该留言。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#fafbfd;border-top:1px solid #eef1f6;color:#9ca3af;font-size:12px;">
                        本邮件由系统自动发送，请勿直接回复。
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
