<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>订单状态通知</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Microsoft YaHei',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(31,41,55,.06);">
                <tr>
                    <td style="background:#2f6fed;padding:20px 28px;color:#ffffff;">
                        <div style="font-size:17px;font-weight:700;" th:text="${title != null ? title : '订单状态通知'}">
                            订单状态通知
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#374151;font-size:14px;line-height:1.9;">
                        <p style="margin:0 0 14px;">你好，<b th:text="${nickname != null ? nickname : '同学'}">同学</b>：</p>
                        <p style="margin:0 0 16px;" th:text="${content}">订单内容说明</p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background:#f7f9fc;border-radius:8px;padding:0;margin:0 0 16px;">
                            <tr>
                                <td style="padding:14px 16px;font-size:13px;color:#6b7280;width:96px;">订单编号</td>
                                <td style="padding:14px 16px 14px 0;font-size:13px;color:#1f2937;"
                                    th:text="${orderNo}">SC20240101000000000</td>
                            </tr>
                            <tr>
                                <td style="padding:0 16px 14px;font-size:13px;color:#6b7280;">物品名称</td>
                                <td style="padding:0 16px 14px 0;font-size:13px;color:#1f2937;"
                                    th:text="${itemTitle}">物品标题</td>
                            </tr>
                            <tr>
                                <td style="padding:0 16px 14px;font-size:13px;color:#6b7280;">订单金额</td>
                                <td style="padding:0 16px 14px 0;font-size:15px;color:#ff7a45;font-weight:700;"
                                    th:text="'￥' + ${amount}">￥0</td>
                            </tr>
                        </table>

                        <p style="margin:0;color:#6b7280;font-size:13px;">
                            登录平台 → 「我的订单」（或「卖出的」），即可查看订单状态与操作按钮。
                            买家下单后 30 分钟内未支付，系统会自动关闭订单并释放物品。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#fafbfd;border-top:1px solid #eef1f6;color:#9ca3af;font-size:12px;">
                        本邮件由 RabbitMQ 异步发送，请勿直接回复。
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
