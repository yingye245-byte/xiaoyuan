<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>物品审核结果</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Microsoft YaHei',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(31,41,55,.06);">
                <tr>
                    <td style="background:#2f6fed;padding:20px 28px;color:#ffffff;">
                        <div style="font-size:17px;font-weight:700;">物品审核结果通知</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#374151;font-size:14px;line-height:1.9;">
                        <p style="margin:0 0 14px;">你好，<b th:text="${nickname != null ? nickname : '卖家'}">卖家</b>：</p>
                        <p style="margin:0 0 14px;">
                            你发布的物品「<b th:text="${itemTitle}">物品标题</b>」已完成审核，
                            审核结论：
                            <span th:style="${result == '通过'} ? 'color:#0f8a4f;font-weight:700;' : 'color:#d4380d;font-weight:700;'"
                                  th:text="${result}">通过</span>。
                        </p>

                        <div th:if="${remark != null and remark != ''}"
                             style="background:#fff7f5;border-left:3px solid #ff7a45;padding:12px 16px;border-radius:6px;margin:16px 0;">
                            <div style="font-weight:600;margin-bottom:4px;">审核说明</div>
                            <div style="font-size:13px;color:#4b5563;" th:text="${remark}">说明</div>
                        </div>

                        <p style="margin:0 0 14px;">
                            <span th:if="${result == '通过'}">
                                物品已上架，其他同学可以在「分类浏览」中看到它。
                                请在买家下单后及时确认交付，超时未支付的订单系统会自动关闭。
                            </span>
                            <span th:if="${result != '通过'}">
                                请根据审核说明修改物品信息后，在「我的发布」中点击「重新提交审核」。
                            </span>
                        </p>

                        <p style="margin:0;color:#6b7280;font-size:13px;">
                            登录平台 → 「我的发布」，即可查看物品状态与审核记录。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#fafbfd;border-top:1px solid #eef1f6;color:#9ca3af;font-size:12px;">
                        本邮件由系统自动发送，请勿直接回复。
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
