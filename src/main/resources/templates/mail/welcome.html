<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>欢迎加入校园二手闲置交易平台</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fa;font-family:'Microsoft YaHei',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(31,41,55,.06);">
                <tr>
                    <td style="background:#2f6fed;padding:20px 28px;color:#ffffff;">
                        <div style="font-size:17px;font-weight:700;">校园二手闲置交易平台</div>
                        <div style="font-size:12px;opacity:.85;margin-top:4px;">让闲置流动起来，让同学更省心</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#374151;font-size:14px;line-height:1.9;">
                        <p style="margin:0 0 14px;">你好，<b th:text="${nickname != null ? nickname : '同学'}">同学</b>：</p>
                        <p style="margin:0 0 14px;">
                            欢迎注册校园二手闲置交易平台！你的登录账号是
                            <b th:text="${username != null ? username : '（见注册信息）'}">username</b>。
                        </p>
                        <p style="margin:0 0 14px;">
                            在这里你可以：发布闲置物品（上传多张实拍图、设置成色与价格）、
                            按分类与关键词检索、收藏心仪物品、在线下单并与卖家留言沟通。
                        </p>
                        <div style="background:#f7f9fc;border-left:3px solid #2f6fed;padding:12px 16px;border-radius:6px;margin:16px 0;">
                            <div style="font-weight:600;margin-bottom:4px;">小提示</div>
                            <div style="font-size:13px;color:#4b5563;">
                                发布第一件物品后，系统会自动为你开通「卖家」角色，即可管理自己的全部闲置。
                                交易请优先选择校内当面交付，注意保护个人信息。
                            </div>
                        </div>
                        <p style="margin:0;color:#6b7280;font-size:13px;">
                            如需修改密码或资料，请登录后在「个人中心」操作。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;background:#fafbfd;border-top:1px solid #eef1f6;color:#9ca3af;font-size:12px;">
                        本邮件由系统自动发送，请勿直接回复。
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
