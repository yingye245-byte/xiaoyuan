<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>500 - 服务器异常</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card" style="text-align:center">
        <div class="auth-sub">500</div>
        <h2>服务器开小差了</h2>
        <p class="muted mt-8" th:text="${message != null ? message : '系统处理请求时出现异常，请稍后再试。'}">
            系统处理请求时出现异常，请稍后再试。
        </p>
        <p class="small muted">异常详情已写入应用日志（logs/campus-secondhand.log），便于排查。</p>
        <div class="mt-16">
            <a class="btn btn-primary" th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
