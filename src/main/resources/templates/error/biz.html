<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>操作未完成</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card" style="text-align:center">
        <div class="auth-sub">提示</div>
        <h2>操作未完成</h2>
        <p class="muted mt-8" th:text="${message != null ? message : '请求无法继续，请检查后重试。'}">
            请求无法继续，请检查后重试。
        </p>
        <div class="mt-16">
            <a class="btn btn-primary" href="javascript:history.back()">返回上一页</a>
            <a class="btn" th:href="@{/}">返回首页</a>
        </div>
    </div>
</div>
</body>
</html>
