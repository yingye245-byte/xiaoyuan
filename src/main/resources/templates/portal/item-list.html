<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('闲置市场')}"></head>
<body>

<header th:replace="~{fragments/common :: header('items')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container">
    <div class="section-head mt-16">
        <h2>
            闲置市场
            <span class="small muted" th:if="${currentCategory != null}"
                  th:text="' / ' + ${currentCategory.name}"> / 分类</span>
        </h2>
        <span class="small muted" th:text="'共找到 ' + ${page.total} + ' 件物品'">共 0 件物品</span>
    </div>

    <!-- ================= 筛选条 ================= -->
    <div class="card mb-16">
        <form class="filter-bar" th:action="@{/items}" method="get">
            <input class="input" type="text" name="keyword" style="min-width:240px"
                   placeholder="关键词：书名 / 品牌 / 型号"
                   th:value="${query.keyword}"/>
            <select class="select" name="categoryId">
                <option value="">全部分类</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${query.categoryId != null and query.categoryId == c.id}"></option>
            </select>
            <input class="input" type="number" name="minPrice" min="0" step="0.01"
                   placeholder="最低价" style="min-width:100px" th:value="${query.minPrice}"/>
            <input class="input" type="number" name="maxPrice" min="0" step="0.01"
                   placeholder="最高价" style="min-width:100px" th:value="${query.maxPrice}"/>
            <input class="input" type="text" name="campus" placeholder="校区"
                   style="min-width:110px" th:value="${query.campus}"/>
            <select class="select" name="sort">
                <option value="">最新发布</option>
                <option value="priceAsc" th:selected="${query.sort == 'priceAsc'}">价格从低到高</option>
                <option value="priceDesc" th:selected="${query.sort == 'priceDesc'}">价格从高到低</option>
                <option value="hot" th:selected="${query.sort == 'hot'}">人气最高</option>
            </select>
            <button class="btn btn-primary" type="submit">筛选</button>
            <a class="btn btn-ghost" th:href="@{/items}">重置</a>
        </form>
    </div>

    <!-- ================= 结果列表 ================= -->
    <div class="grid grid-4" th:if="${!#lists.isEmpty(page.records)}">
        <div th:each="item : ${page.records}">
            <div th:replace="~{fragments/common :: itemCard(${item})}"></div>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(page.records)}"><div th:replace="~{fragments/common :: empty('没有找到符合条件的物品，换个关键词试试吧')}"></div></th:block>

    <div th:replace="~{fragments/common :: pager(${page})}"></div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
