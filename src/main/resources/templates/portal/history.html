<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('浏览记录')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container">
    <div class="section-head mt-16">
        <h2>浏览记录</h2>
        <span class="small muted">记录保存在 Redis，最多保留最近 20 件</span>
    </div>

    <div class="grid grid-4" th:if="${!#lists.isEmpty(items)}">
        <div th:each="item : ${items}">
            <div th:replace="~{fragments/common :: itemCard(${item})}"></div>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(items)}"><div th:replace="~{fragments/common :: empty('还没有浏览记录，去市场逛逛吧')}"></div></th:block>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
