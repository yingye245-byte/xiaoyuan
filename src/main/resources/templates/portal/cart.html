<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('购物车')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container">

    <div class="section-head mt-16">
        <h2>购物车</h2>
        <span class="small muted">购物车数据保存在 Redis 中，7 天有效</span>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(items)}">
        <div class="table-wrap">
            <table class="data">
                <thead>
                <tr>
                    <th style="width:70px">封面</th>
                    <th>物品</th>
                    <th style="width:130px">价格</th>
                    <th style="width:110px">状态</th>
                    <th style="width:200px">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td><img class="cell-img" th:src="${item.coverImg}" alt="封面"/></td>
                    <td>
                        <a th:href="@{'/item/' + ${item.id}}" th:text="${item.title}">标题</a>
                        <div class="small muted" th:text="${item.campus}">校区</div>
                    </td>
                    <td class="price" th:text="'¥' + ${#numbers.formatDecimal(item.price, 1, 2)}">¥0</td>
                    <td>
                        <span class="tag" th:classappend="${item.status == 1} ? 'tag-green' : 'tag-gray'"
                              th:text="${item.status == 1} ? '在售' : '已下架'">在售</span>
                    </td>
                    <td>
                        <div class="actions">
                            <a class="btn btn-sm btn-primary" th:if="${item.status == 1}"
                               th:href="@{/order/create(itemId=${item.id})}">去结算</a>
                            <form th:action="@{/cart/remove}" method="post">
                                <input type="hidden" name="itemId" th:value="${item.id}"/>
                                <button class="btn btn-sm" type="submit">移除</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex-between mt-16">
            <form th:action="@{/cart/clear}" method="post">
                <button class="btn btn-sm" type="submit" data-confirm="确定清空购物车？">清空购物车</button>
            </form>
            <div>
                合计：<span class="price price-lg" th:text="'¥' + ${#numbers.formatDecimal(totalAmount, 1, 2)}">¥0</span>
                <span class="small muted">（不含已下架物品，请逐件结算）</span>
            </div>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(items)}"><div th:replace="~{fragments/common :: empty('购物车还是空的，去市场挑几件吧')}"></div></th:block>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
