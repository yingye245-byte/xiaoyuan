<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('修改密码')}"></head>
<body>

<header th:replace="~{fragments/common :: header('')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container" style="max-width:560px">
    <div class="section-head mt-16">
        <h2>修改密码</h2>
        <a class="small" th:href="@{/user/profile}">返回个人中心</a>
    </div>

    <div class="card">
        

        <form th:action="@{/user/password}" method="post" th:object="${passwordDTO}">
            <div class="form-item">
                <label class="form-label" for="oldPassword">当前密码<span class="required">*</span></label>
                <input class="input" type="password" id="oldPassword" th:field="*{oldPassword}"
                       placeholder="请输入当前登录密码"/>
            </div>
            <div class="form-item">
                <label class="form-label" for="newPassword">新密码<span class="required">*</span></label>
                <input class="input" type="password" id="newPassword" th:field="*{newPassword}"
                       placeholder="6-20 位，建议字母 + 数字"/>
            </div>
            <div class="form-item">
                <label class="form-label" for="confirmPassword">确认新密码<span class="required">*</span></label>
                <input class="input" type="password" id="confirmPassword" th:field="*{confirmPassword}"
                       placeholder="再次输入新密码"/>
            </div>
            <button class="btn btn-primary btn-block" type="submit">确认修改</button>
        </form>

        <div class="form-tip mt-16">密码采用 BCrypt 加盐加密存储，任何人（包括管理员）都无法查看明文。</div>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
