<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('发布闲置')}"></head>
<body>

<header th:replace="~{fragments/common :: header('publish')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container" style="max-width:820px">

    <div class="section-head mt-16">
        <h2>发布闲置</h2>
        <span class="small muted">提交后需管理员审核，审核通过自动上架</span>
    </div>

    <div class="flash flash-error" th:if="${error != null}" th:text="${error}"></div>

    <form class="card" th:action="@{/items/publish}" method="post"
          enctype="multipart/form-data" th:object="${itemDTO}">

        <div class="form-item">
            <label class="form-label" for="title">物品标题<span class="required">*</span></label>
            <input class="input" type="text" id="title" th:field="*{title}" maxlength="60"
                   placeholder="一句话说清楚：品牌 + 型号 + 关键卖点，4-60 字"/>
            <div class="form-tip">例如：九成新 罗技 G102 有线鼠标，带原装包装盒</div>
        </div>

        <div class="grid grid-2 gap-12">
            <div class="form-item">
                <label class="form-label" for="categoryId">物品分类<span class="required">*</span></label>
                <select class="select" id="categoryId" th:field="*{categoryId}">
                    <option value="">请选择分类</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
            </div>
            <div class="form-item">
                <label class="form-label" for="conditionLevel">物品成色<span class="required">*</span></label>
                <select class="select" id="conditionLevel" th:field="*{conditionLevel}">
                    <option value="">请选择成色</option>
                    <option th:each="c, st : ${conditions}" th:value="${st.count}" th:text="${c}"></option>
                </select>
            </div>
        </div>

        <div class="grid grid-3 gap-12">
            <div class="form-item">
                <label class="form-label" for="price">出售价格（元）<span class="required">*</span></label>
                <input class="input" type="number" id="price" th:field="*{price}"
                       min="0.01" step="0.01" placeholder="0.00"/>
            </div>
            <div class="form-item">
                <label class="form-label" for="originalPrice">原价（元）</label>
                <input class="input" type="number" id="originalPrice" th:field="*{originalPrice}"
                       min="0" step="0.01" placeholder="选填"/>
            </div>
            <div class="form-item">
                <label class="form-label" for="campus">交易校区</label>
                <input class="input" type="text" id="campus" th:field="*{campus}"
                       placeholder="如：东校区"/>
            </div>
        </div>

        <div class="form-item">
            <label class="form-label" for="description">物品描述<span class="required">*</span></label>
            <textarea class="textarea" id="description" th:field="*{description}" rows="6" maxlength="2000"
                      placeholder="购买时间、使用情况、有无瑕疵、配件是否齐全、可接受的交易方式等（10-2000 字）"></textarea>
            <div class="form-tip">描述越详细，越容易卖出</div>
        </div>

        <div class="form-item">
            <label class="form-label">物品图片<span class="required">*</span></label>
            <input class="input" type="file" id="imageInput" name="images" multiple accept="image/*"/>
            <div class="form-tip">最多 5 张，支持 jpg/png/gif，单张不超过 5MB；第一张将作为封面</div>
            <div id="imagePreview" class="gallery-thumbs mt-8"></div>
        </div>

        <div class="flex gap-12 mt-24">
            <button class="btn btn-primary btn-lg" type="submit">提交审核</button>
            <a class="btn btn-lg" th:href="@{/my-items}">取消</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
