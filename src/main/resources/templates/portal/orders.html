<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的订单')}"></head>
<body>

<header th:replace="~{fragments/common :: header('orders')}"></header>
<div th:replace="~{fragments/common :: flash}"></div>

<div class="container">

    <div class="section-head mt-16">
        <h2 th:text="${view == 'sell'} ? '我卖出的' : '我买到的'">我的订单</h2>
        <div class="flex gap-8">
            <a class="btn btn-sm" th:href="@{/orders/mine}"
               th:classappend="${view == 'buy'} ? 'btn-primary' : ''">我买到的</a>
            <a class="btn btn-sm" th:href="@{/orders/sold}"
               th:classappend="${view == 'sell'} ? 'btn-primary' : ''">我卖出的</a>
        </div>
    </div>

    <!-- 状态筛选 -->
    <div class="category-strip mb-16" th:with="base=${view == 'sell'} ? '/orders/sold' : '/orders/mine'">
        <a class="category-chip" th:href="@{${base}}"
           th:classappend="${status == null} ? 'active' : ''">全部</a>
        <a class="category-chip" th:href="@{${base + '?status=0'}}"
           th:classappend="${status != null and status == 0} ? 'active' : ''">待支付</a>
        <a class="category-chip" th:href="@{${base + '?status=1'}}"
           th:classappend="${status != null and status == 1} ? 'active' : ''">待交付</a>
        <a class="category-chip" th:href="@{${base + '?status=2'}}"
           th:classappend="${status != null and status == 2} ? 'active' : ''">已完成</a>
        <a class="category-chip" th:href="@{${base + '?status=3'}}"
           th:classappend="${status != null and status == 3} ? 'active' : ''">已取消</a>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(page.records)}">
        <div class="table-wrap">
            <table class="data">
                <thead>
                <tr>
                    <th style="width:70px">封面</th>
                    <th>物品 / 订单号</th>
                    <th style="width:110px">金额</th>
                    <th style="width:100px">状态</th>
                    <th style="width:150px">下单时间</th>
                    <th style="width:110px">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${page.records}">
                    <td><img class="cell-img" th:src="${o.itemCover}" alt="封面"/></td>
                    <td>
                        <a th:href="@{'/item/' + ${o.itemId}}" th:text="${o.itemTitle}">物品标题</a>
                        <div class="small muted" th:text="${o.orderNo}">订单号</div>
                    </td>
                    <td class="price" th:text="'¥' + ${#numbers.formatDecimal(o.amount, 1, 2)}">¥0</td>
                    <td>
                        <span class="tag"
                              th:classappend="${o.status == 0} ? 'tag-orange' : (${o.status == 2} ? 'tag-green' : (${o.status == 3} ? 'tag-red' : ''))"
                              th:text="${o.statusText}">状态</span>
                    </td>
                    <td class="small muted"
                        th:text="${#temporals.format(o.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                    <td><a class="btn btn-sm" th:href="@{'/order/' + ${o.id}}">查看</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <th:block th:if="${#lists.isEmpty(page.records)}"><div th:replace="~{fragments/common :: empty('还没有订单，去市场看看吧')}"></div></th:block>

    <div th:replace="~{fragments/common :: pager(${page})}"></div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
