<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head('留言管理')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar(${menus}, ${active})}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('留言管理')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <form class="toolbar" th:action="@{/admin/comments}" method="get">
                <input class="input" type="text" name="keyword" th:value="${keyword}"
                       placeholder="搜索留言内容 / 物品标题"/>
                <button class="btn btn-primary btn-sm" type="submit">查询</button>
                <a class="btn btn-sm" th:href="@{/admin/comments}">重置</a>
                <span class="small muted">共 <b th:text="${page.total}">0</b> 条留言</span>
            </form>

            <div class="card">
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th style="width:70px">ID</th>
                            <th style="width:200px">所属物品</th>
                            <th style="width:130px">留言人</th>
                            <th>内容</th>
                            <th style="width:90px">层级</th>
                            <th style="width:160px">时间</th>
                            <th style="width:110px">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${page.records}">
                            <td th:text="${c.id}">1</td>
                            <td class="small">
                                <a th:href="@{/item/{id}(id=${c.itemId})}" target="_blank"
                                   th:text="${c.itemTitle != null ? c.itemTitle : ('物品 #' + c.itemId)}">物品</a>
                            </td>
                            <td class="small" th:text="${c.userNickname}">留言人</td>
                            <td class="small" th:text="${c.content}">内容</td>
                            <td>
                                <span class="tag tag-gray" th:if="${c.parentId == null or c.parentId == 0}">主留言</span>
                                <span class="tag tag-orange" th:if="${c.parentId != null and c.parentId > 0}">回复</span>
                            </td>
                            <td class="small muted"
                                th:text="${#temporals.format(c.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                            <td>
                                <form th:action="@{/admin/comments/{id}/delete(id=${c.id})}" method="post">
                                    <button class="btn btn-sm" type="submit"
                                            th:data-confirm="'确认删除该留言？'">删除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(page.records)}">
                            <td colspan="7" class="muted text-center">没有符合条件的留言</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/common :: pager(${page})}"></div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
