<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head('分类管理')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar(${menus}, ${active})}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('分类管理')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <!-- ============ 新增分类 ============ -->
            <div class="card mb-16">
                <div class="card-title">新增分类</div>
                <form class="toolbar" th:action="@{/admin/categories/save}" method="post">
                    <input class="input" type="text" name="name" placeholder="分类名称（必填）" required/>
                    <select class="select" name="parentId">
                        <option value="0">作为一级分类</option>
                        <option th:each="c : ${topCategories}" th:value="${c.id}"
                                th:text="'归入：' + ${c.name}"></option>
                    </select>
                    <input class="input" type="text" name="icon" placeholder="图标（可选，如 📚）"/>
                    <input class="input" type="number" name="sort" placeholder="排序值" value="0"/>
                    <button class="btn btn-primary btn-sm" type="submit">保存</button>
                </form>
            </div>

            <!-- ============ 分类列表（含二级） ============ -->
            <div class="card">
                <div class="card-title">分类列表（一级 / 二级）</div>
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th style="width:70px">ID</th>
                            <th style="width:60px">图标</th>
                            <th>名称</th>
                            <th style="width:110px">层级</th>
                            <th style="width:110px">物品数</th>
                            <th style="width:80px">排序</th>
                            <th style="width:90px">状态</th>
                            <th style="width:340px">操作</th>
                        </tr>
                        </thead>
                        <!-- 一级分类 + 其子分类：每个一级分类一个 tbody（HTML 允许同一表格多个 tbody） -->
                        <tbody th:each="top : ${topCategories}">
                        <tr>
                            <td th:text="${top.id}">1</td>
                            <td th:text="${top.icon}">📚</td>
                            <td><b th:text="${top.name}">一级分类</b></td>
                            <td><span class="tag tag-gray">一级</span></td>
                            <td th:text="${top.itemCount}">0</td>
                            <td th:text="${top.sort}">0</td>
                            <td>
                                <span class="tag" th:classappend="${top.status == 1} ? 'tag-green' : 'tag-red'"
                                      th:text="${top.status == 1} ? '启用' : '停用'">启用</span>
                            </td>
                            <td>
                                <form class="inline-form" th:action="@{/admin/categories/update}" method="post">
                                    <input type="hidden" name="id" th:value="${top.id}"/>
                                    <input class="input" type="text" name="name" th:value="${top.name}" required/>
                                    <input class="input" type="number" name="sort" th:value="${top.sort}" style="width:70px"/>
                                    <button class="btn btn-sm" type="submit">保存</button>
                                </form>
                                <form class="inline-form mt-8" th:action="@{/admin/categories/toggle}" method="post">
                                    <input type="hidden" name="id" th:value="${top.id}"/>
                                    <button class="btn btn-sm" type="submit"
                                            th:text="${top.status == 1} ? '停用' : '启用'">停用</button>
                                </form>
                                <form class="inline-form" th:action="@{/admin/categories/delete}" method="post">
                                    <input type="hidden" name="id" th:value="${top.id}"/>
                                    <button class="btn btn-sm" type="submit"
                                            th:data-confirm="'确认删除该分类？有物品或子分类时会被拒绝。'">删除</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:each="sub : ${top.children}">
                            <td th:text="${sub.id}">2</td>
                            <td th:text="${sub.icon}">·</td>
                            <td style="padding-left:26px" th:text="${sub.name}">二级分类</td>
                            <td><span class="tag tag-gray">二级</span></td>
                            <td th:text="${sub.itemCount}">0</td>
                            <td th:text="${sub.sort}">0</td>
                            <td>
                                <span class="tag" th:classappend="${sub.status == 1} ? 'tag-green' : 'tag-red'"
                                      th:text="${sub.status == 1} ? '启用' : '停用'">启用</span>
                            </td>
                            <td>
                                <form class="inline-form" th:action="@{/admin/categories/update}" method="post">
                                    <input type="hidden" name="id" th:value="${sub.id}"/>
                                    <input class="input" type="text" name="name" th:value="${sub.name}" required/>
                                    <input class="input" type="number" name="sort" th:value="${sub.sort}" style="width:70px"/>
                                    <button class="btn btn-sm" type="submit">保存</button>
                                </form>
                                <form class="inline-form mt-8" th:action="@{/admin/categories/toggle}" method="post">
                                    <input type="hidden" name="id" th:value="${sub.id}"/>
                                    <button class="btn btn-sm" type="submit"
                                            th:text="${sub.status == 1} ? '停用' : '启用'">停用</button>
                                </form>
                                <form class="inline-form" th:action="@{/admin/categories/delete}" method="post">
                                    <input type="hidden" name="id" th:value="${sub.id}"/>
                                    <button class="btn btn-sm" type="submit"
                                            th:data-confirm="'确认删除该分类？'">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
