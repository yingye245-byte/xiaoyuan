<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head('用户管理')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar(${menus}, ${active})}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('用户管理')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <form class="toolbar" th:action="@{/admin/users}" method="get">
                <input class="input" type="text" name="keyword" th:value="${keyword}"
                       placeholder="搜索用户名 / 昵称 / 学号"/>
                <select class="select" name="roleId">
                    <option value="">全部角色</option>
                    <option th:each="r : ${roles}" th:value="${r.id}"
                            th:text="${r.name}" th:selected="${roleId != null and roleId == r.id}"></option>
                </select>
                <button class="btn btn-primary btn-sm" type="submit">查询</button>
                <a class="btn btn-sm" th:href="@{/admin/users}">重置</a>
                <span class="small muted">共 <b th:text="${page.total}">0</b> 个用户</span>
            </form>

            <div class="card">
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th style="width:60px">ID</th>
                            <th style="width:60px">头像</th>
                            <th style="width:120px">用户名</th>
                            <th style="width:120px">昵称</th>
                            <th>邮箱</th>
                            <th style="width:130px">校区 / 学号</th>
                            <th style="width:150px">角色</th>
                            <th style="width:80px">信用分</th>
                            <th style="width:80px">状态</th>
                            <th style="width:150px">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${page.records}">
                            <td th:text="${u.id}">1</td>
                            <td><img class="cell-img" th:src="${u.avatar} ?: '/img/default-avatar.svg'" alt="头像"/></td>
                            <td th:text="${u.username}">username</td>
                            <td th:text="${u.nickname}">昵称</td>
                            <td class="small" th:text="${u.email}">邮箱</td>
                            <td class="small">
                                <div th:text="${u.campus}">校区</div>
                                <div class="muted" th:text="${u.studentNo}">学号</div>
                            </td>
                            <td class="small" th:text="${u.roleNames}">角色</td>
                            <td th:text="${u.creditScore}">100</td>
                            <td>
                                <span class="tag" th:classappend="${u.status == 1} ? 'tag-green' : 'tag-red'"
                                      th:text="${u.status == 1} ? '正常' : '禁用'">正常</span>
                            </td>
                            <td>
                                <a class="btn btn-sm" th:href="@{/admin/users/{id}/roles(id=${u.id})}">分配角色</a>
                                <form class="inline-form" style="display:inline-block"
                                      th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                                    <button class="btn btn-sm" type="submit"
                                            th:data-confirm="${u.status == 1} ? '确认禁用该用户？' : '确认启用该用户？'">
                                        <span th:text="${u.status == 1} ? '禁用' : '启用'">禁用</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(page.records)}">
                            <td colspan="10" class="muted text-center">没有符合条件的用户</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/common :: pager(${page})}"></div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
