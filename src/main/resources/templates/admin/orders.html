<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin :: head('订单管理')}"></head>
<body>
<div class="admin-layout">
    <aside th:replace="~{fragments/admin :: sidebar(${menus}, ${active})}"></aside>

    <div class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('订单管理')}"></header>

        <main class="admin-content">
            <div th:replace="~{fragments/admin :: flash}"></div>

            <form class="toolbar" th:action="@{/admin/orders}" method="get">
                <input class="input" type="text" name="keyword" th:value="${keyword}"
                       placeholder="搜索订单号 / 物品标题"/>
                <select class="select" name="status">
                    <option value="" th:selected="${status == null}">全部状态</option>
                    <option value="0" th:selected="${status != null and status == 0}">待支付</option>
                    <option value="1" th:selected="${status != null and status == 1}">已支付待交付</option>
                    <option value="2" th:selected="${status != null and status == 2}">已完成</option>
                    <option value="3" th:selected="${status != null and status == 3}">已取消</option>
                </select>
                <button class="btn btn-primary btn-sm" type="submit">查询</button>
                <a class="btn btn-sm" th:href="@{/admin/orders}">重置</a>
                <span class="small muted">共 <b th:text="${page.total}">0</b> 笔订单</span>
            </form>

            <div class="card">
                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th style="width:70px">ID</th>
                            <th style="width:190px">订单号</th>
                            <th>物品</th>
                            <th style="width:110px">买家</th>
                            <th style="width:110px">卖家</th>
                            <th style="width:100px">金额</th>
                            <th style="width:120px">状态</th>
                            <th style="width:160px">下单时间</th>
                            <th style="width:150px">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="o : ${page.records}">
                            <td th:text="${o.id}">1</td>
                            <td class="small" th:text="${o.orderNo}">单号</td>
                            <td>
                                <a th:href="@{/item/{id}(id=${o.itemId})}" target="_blank"
                                   th:text="${o.itemTitle}">物品</a>
                            </td>
                            <td class="small" th:text="${o.buyerName}">买家</td>
                            <td class="small" th:text="${o.sellerName}">卖家</td>
                            <td class="price" th:text="'￥' + ${o.amount}">￥0</td>
                            <td>
                                <span class="tag"
                                      th:classappend="${o.status == 0} ? 'tag-orange' : (${o.status == 1} ? 'tag-green' : 'tag-gray')"
                                      th:text="${o.statusText}">状态</span>
                                <div class="small muted" th:if="${o.cancelReason != null}"
                                     th:text="${o.cancelReason}">原因</div>
                            </td>
                            <td class="small muted"
                                th:text="${#temporals.format(o.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                            <td>
                                <form th:if="${o.status == 0}" th:action="@{/admin/orders/{id}/close(id=${o.id})}"
                                      method="post">
                                    <button class="btn btn-sm" type="submit"
                                            th:data-confirm="'确认关闭该未支付订单？物品将恢复在售。'">关闭订单</button>
                                </form>
                                <span class="small muted" th:if="${o.status != 0}">—</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(page.records)}">
                            <td colspan="9" class="muted text-center">没有符合条件的订单</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{fragments/common :: pager(${page})}"></div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
