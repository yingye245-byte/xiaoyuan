<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  公共片段文件
  说明：前台所有页面统一引用本文件的 head / header / flash / pager / footer 等片段，
        保证「页面拆分 + 片段复用」的技术要求
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' - 校园二手闲置交易平台'">校园二手闲置交易平台</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<body>

<!-- ================= 顶部导航 ================= -->
<header th:fragment="header(active)" class="site-header">
    <div class="container">
        <a class="logo" th:href="@{/}">
            <span class="logo-badge">校</span><span>校园二手</span>
        </a>
        <nav class="nav">
            <a th:href="@{/}" th:classappend="${active == 'index'} ? 'active' : ''">首页</a>
            <a th:href="@{/items}" th:classappend="${active == 'items'} ? 'active' : ''">逛市场</a>
            <a th:href="@{/items/publish}"
               th:classappend="${active == 'publish'} ? 'active' : ''"
               sec:authorize="isAuthenticated()">发布闲置</a>
            <a th:href="@{/my-items}"
               th:classappend="${active == 'my-items'} ? 'active' : ''"
               sec:authorize="isAuthenticated()">我的闲置</a>
            <a th:href="@{/orders/mine}"
               th:classappend="${active == 'orders'} ? 'active' : ''"
               sec:authorize="isAuthenticated()">我的订单</a>
            <a th:href="@{/user/messages}"
               th:classappend="${active == 'messages'} ? 'active' : ''"
               sec:authorize="isAuthenticated()">消息<span class="badge-dot"
                   th:if="${unreadCount != null and unreadCount > 0}"
                   th:text="${unreadCount}">0</span></a>
        </nav>
        <div class="header-actions" sec:authorize="isAuthenticated()">
            <a class="user-chip" th:href="@{/user/profile}" title="个人中心">
                <img th:src="${#authentication.principal.avatar} ?: '/img/default-avatar.svg'" alt="头像"/>
                <span th:text="${#authentication.principal.nickname}">同学</span>
            </a>
            <a class="btn btn-ghost btn-sm" th:href="@{/cart}">购物车</a>
            <a class="btn btn-ghost btn-sm" sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/dashboard}">后台</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-sm" type="submit">退出</button>
            </form>
        </div>
        <div class="header-actions" sec:authorize="!isAuthenticated()">
            <a class="btn btn-sm" th:href="@{/login}">登录</a>
            <a class="btn btn-primary btn-sm" th:href="@{/register}">注册</a>
        </div>
    </div>
</header>

<!-- ================= 提示信息 ================= -->
<div th:fragment="flash" class="container">
    <div class="flash flash-success" th:if="${msg != null}" th:text="${msg}">操作成功</div>
    <div class="flash flash-error" th:if="${error != null}" th:text="${error}">操作失败</div>
</div>

<!-- ================= 物品卡片 ================= -->
<a th:fragment="itemCard(item)" class="item-card" th:href="@{'/item/' + ${item.id}}">
    <div class="thumb">
        <img th:src="${item.coverImg}" th:alt="${item.title}"/>
    </div>
    <div class="body">
        <div class="title" th:text="${item.title}">物品标题</div>
        <div class="tag-row">
            <span class="tag" th:if="${item.categoryName != null}" th:text="${item.categoryName}">分类</span>
            <span class="tag tag-gray" th:if="${item.conditionText != null}" th:text="${item.conditionText}">成色</span>
        </div>
        <div class="meta">
            <span class="price" th:text="'¥' + ${#numbers.formatDecimal(item.price, 1, 2)}">¥0.00</span>
            <span th:text="${item.campus}">校区</span>
        </div>
    </div>
</a>

<!-- ================= 分页 ================= -->
<!--
  分页片段：链接的 href 由 js/app.js 根据当前地址栏参数拼接，
  这样「关键词 / 分类 / 价格区间 / 状态」等筛选条件在翻页时不会丢失
-->
<div th:fragment="pager(page)" class="pager"
     th:if="${page != null and page.pages > 1}"
     th:with="cur=${page.current}, total=${page.pages},
              from=${page.current - 2 > 1 ? page.current - 2 : 1},
              to=${page.current + 2 < page.pages ? page.current + 2 : page.pages}">
    <a href="javascript:void(0)" data-page="1" th:if="${page.current > 1}">首页</a>
    <a href="javascript:void(0)" data-page="${page.current - 1}" th:if="${page.current > 1}">上一页</a>
    <a href="javascript:void(0)" th:each="i : ${#numbers.sequence(from, to)}"
       th:data-page="${i}" th:text="${i}"
       th:classappend="${i == page.current} ? 'current' : ''">1</a>
    <a href="javascript:void(0)" data-page="${page.current + 1}" th:if="${page.current < page.pages}">下一页</a>
    <a href="javascript:void(0)" data-page="${page.pages}" th:if="${page.current < page.pages}">末页</a>
    <span class="small muted" th:text="'共 ' + ${page.total} + ' 条 / ' + ${page.pages} + ' 页'">共 0 条</span>
</div>

<!-- ================= 空状态 ================= -->
<div th:fragment="empty(text)" class="empty">
    <div class="icon">🗂</div>
    <div th:text="${text}">暂无数据</div>
</div>

<!-- ================= 页脚 ================= -->
<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <div>校园二手闲置交易平台 · Spring Boot 企业级项目实训作品</div>
        <div class="small mt-8">
            Thymeleaf 服务端渲染 · Spring Security 权限控制 · Redis 缓存 · RabbitMQ 消息队列
        </div>
    </div>
</footer>

</body>
</html>
