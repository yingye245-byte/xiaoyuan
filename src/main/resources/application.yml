server:
  port: 8080
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: campus-secondhand
  profiles:
    active: dev
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  messages:
    basename: messages
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.secondhand.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

# 文件上传
file:
  upload-path: D:/campus-upload/
  allowed-ext: jpg,jpeg,png,gif,webp
  max-size: 5242880
  access-prefix: /upload/

# 业务可调参数
app:
  page-size: 12
  admin-page-size: 10
  mail:
    mock: true
    from-name: 校园二手平台

# RabbitMQ 业务参数
mq:
  order:
    delay-ms: 1800000
  consumer:
    enabled: true