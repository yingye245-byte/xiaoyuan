server:
  port: 8080
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: campus-secondhand
  profiles:
    active: dev
  thymeleaf:
    # 模板缓存：生产/演示保持开启以提升渲染速度；需要边改页面边看效果时可
    # 用环境变量 SPRING_THYMELEAF_CACHE=false 关闭（会明显变慢，仅调试用）。
    cache: ${SPRING_THYMELEAF_CACHE:true}
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  messages:
    basename: messages
    encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.campus.secondhand.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

# 文件上传
file:
  upload-path: D:/campus-upload/
  allowed-ext: jpg,jpeg,png,gif,webp
  max-size: 5242880
  access-prefix: /upload/

# 业务可调参数
app:
  page-size: 12
  admin-page-size: 10
  security:
    # remember-me 签名密钥，生产环境请用环境变量 REMEMBER_ME_KEY 覆盖
    remember-me-key: ${REMEMBER_ME_KEY:campus-secondhand-remember-key}
  mail:
    mock: true
    from-name: 校园二手平台

# 日志目录：logback 用 logging.file.path 作为输出目录，部署时用 LOG_PATH 环境变量覆盖
logging:
  file:
    path: ${LOG_PATH:logs}

# RabbitMQ 业务参数
mq:
  order:
    delay-ms: 1800000
  consumer:
    enabled: true