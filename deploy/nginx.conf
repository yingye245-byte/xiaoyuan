# Nginx 反向代理配置（校园二手闲置交易平台）
# 放置位置：/etc/nginx/conf.d/campus-secondhand.conf
# 使用前把 server_name 改成自己的域名或服务器 IP

upstream campus_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name campus.example.com;

    # 上传图片最大 25MB（与 spring.servlet.multipart.max-request-size 保持一致）
    client_max_body_size 25m;
    client_body_timeout 60s;

    # 访问日志（按天切割交给 logrotate）
    access_log /var/log/nginx/campus-secondhand.access.log;
    error_log  /var/log/nginx/campus-secondhand.error.log warn;

    # 压缩文本类资源
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 静态资源交给 Nginx 直接返回，命中浏览器与代理缓存
    location /css/ {
        proxy_pass http://campus_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /js/ {
        proxy_pass http://campus_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /lib/ {
        proxy_pass http://campus_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 用户上传的图片：直接由 Nginx 读磁盘（应用内的 /upload/** 映射是给开发环境用的）
    location /upload/ {
        alias /data/campus-secondhand/upload/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        # 禁止目录浏览
        autoindex off;
    }

    # 其余请求全部转给 Spring Boot
    location / {
        proxy_pass http://campus_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
    }

    # 健康检查（可配合负载均衡与监控）
    location = /actuator/health {
        proxy_pass http://campus_app;
        access_log off;
    }
}